[project]
name = "resume-tailor"
version = "0.1.0"
description = "Local Streamlit app: tailor a one-page resume to a job description with a deterministic harness around Gemini 3 Flash."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.20.0",
    "pydantic>=2.9,<3.0",
    "streamlit>=1.40,<2.0",
    "weasyprint>=63,<64",
    "jinja2>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "scikit-learn>=1.5,<2.0",
    "pdfplumber>=0.11,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "render"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = "test_*.py"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
